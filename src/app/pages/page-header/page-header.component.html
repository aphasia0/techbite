<header class="page-header" [class.page-header--article]="date">
  <div class="page-header-copy">
    <p class="publish-date" *ngIf="date">Published on {{ formattedDate }}</p>
    <h1>{{ title }}</h1>
    <p class="page-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
  </div>
  <div class="page-header-media" *ngIf="image" [class.page-header-media--contain]="imageStyle === 'scale'">
    <img [src]="image" [alt]="title || ''" [ngClass]="imageStyle === 'scale' ? 'contain' : 'cover'" />
  </div>
</header>
