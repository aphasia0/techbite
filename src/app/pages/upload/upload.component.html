<div class="upload-page page-container">
  <app-page-header title="PDF Password Remover" subtitle="Use this simple tool to remove password protection from your PDF files"></app-page-header>

  <div class="pdf-tool">
    <p-steps [model]="steps" [activeIndex]="activeStep" [readonly]="true" class="pdf-steps"></p-steps>

    <div class="step-content">
      <div *ngIf="activeStep === 0">
        <form (ngSubmit)="onSubmit()" enctype="multipart/form-data" class="file-upload-form">
          <div class="form-field">
            <label for="file">PDF file</label>
            <input id="file" type="file" (change)="onFileSelected($event)" accept=".pdf" class="file-input" />
          </div>
          <div class="form-field">
            <label for="pwd">Password</label>
            <input id="pwd" type="password" [(ngModel)]="password" name="password" class="password-input" autocomplete="off" />
          </div>
          <button type="submit" pButton label="Remove Password" [disabled]="!selectedFile || !password"
            class="button-primary my-button"></button>
        </form>
      </div>

      <div *ngIf="activeStep === 1" class="progress-container" aria-live="polite">
        <p-progressBar [value]="uploadProgress"></p-progressBar>
        <p class="processing-text">Processing: {{ uploadProgress }}%</p>
      </div>

      <div *ngIf="activeStep === 2" class="complete-container">
        <button pButton label="Process Another File" (click)="reset()" class="button-primary my-button"></button>
      </div>

      <div class="message" *ngIf="errorMessage || message" aria-live="polite">
        <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
        <div class="success-message" *ngIf="message">{{ message }}</div>
      </div>
    </div>
  </div>
</div>
