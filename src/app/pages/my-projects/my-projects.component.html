<div class="projects-page page-container">
  <app-page-header title="My Projects" subtitle="Side projects I've built"></app-page-header>

  <section class="projects-section" aria-label="Projects">
    <div class="project-grid">
      <article *ngFor="let project of projects" class="project-card">
        <div class="project-icon" aria-hidden="true">{{ project.name[0] }}</div>
        <h2>{{ project.name }}</h2>
        <p>{{ project.description }}</p>
        <a [href]="project.url" target="_blank" rel="noopener noreferrer" class="project-link">
          <span>Visit project</span><i nz-icon nzType="export" nzTheme="outline"></i>
        </a>
      </article>
    </div>
  </section>
</div>
