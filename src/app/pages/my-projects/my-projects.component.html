<div class="flex flex-col">
  <app-page-header title="My Projects" subtitle="Side projects I've built" ></app-page-header>

  <div class="mt-12 pt-8 border-t border-gray-200 dark:border-gray-700">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div *ngFor="let project of projects"
        class="project-card flex flex-col p-6 rounded-xl border border-gray-200 dark:border-gray-700 hover:shadow-lg transition-all duration-300 bg-card dark:bg-gray-800"
        style="box-shadow: 0 4px 6px rgba(0,0,0,0.05);">

        <div class="flex items-start gap-4 mb-4">
          <div class="project-icon flex items-center justify-center rounded-lg w-12 h-12 text-white text-xl font-bold flex-shrink-0"
            [style.background-color]="project.color">
            {{project.name[0]}}
          </div>
          <div class="flex-1">
            <h3 class="text-h3 font-medium dark:text-white mb-1">{{project.name}}</h3>
          </div>
        </div>

        <p class="text-text-secondary dark:text-gray-300 text-sm mt-2">{{project.description}}</p>

        <div class="mt-4">
          <a [href]="project.url" target="_blank" rel="noopener noreferrer" 
            class="flex items-center text-sm font-medium underline" [style.color]="project.color">
            <span class="truncate">{{project.url}}</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
